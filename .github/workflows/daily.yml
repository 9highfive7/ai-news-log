name: Daily AI News

on:
  schedule:
    # 毎朝 7:00 JST（= 22:00 UTC 前日）。混雑時は数分〜数十分遅れることがあります
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      provider:
        description: '使うモデル（auto = Variables の LLM_PROVIDER、未設定なら claude ／ compare = 両方で記事化して比較レポートだけを出力）'
        type: choice
        options: [auto, claude, gemini, compare]
        default: auto
      dry_run:
        description: 'dry-run（記事を生成してアーティファクトに保存するだけ。コミット・デプロイ・seen.json更新なし）'
        type: boolean
        default: false
      force_deploy:
        description: '新しい記事が0件でもサイトをビルド・デプロイする'
        type: boolean
        default: false
  # コードやデザインの変更時は、記事生成なしでビルド・デプロイのみ行う
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'

permissions:
  contents: write
  pages: write
  id-token: write

# 同時に複数回走ってコミットが衝突しないようにする
concurrency:
  group: daily-ai-news
  cancel-in-progress: false

jobs:
  generate:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      count: ${{ steps.generate.outputs.count }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate articles
        id: generate
        env:
          # 定期実行では Variables の LLM_PROVIDER を使う（未設定なら claude）
          LLM_PROVIDER: ${{ (inputs.provider && inputs.provider != 'auto') && inputs.provider || vars.LLM_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 比較モードの審査役（Jev）。未設定なら審査なしで比較する
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          TYPESAFE_DEFAULT_MODEL: ${{ vars.TYPESAFE_DEFAULT_MODEL }}
          # Settings > Secrets and variables > Actions > Variables で上書き可能
          # （未設定なら claude-haiku-4-5 / gemini-3.5-flash-lite）
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MAX_ARTICLES: ${{ vars.MAX_ARTICLES }}
        run: npm run ${{ inputs.dry_run && 'generate:dry' || 'generate' }}

      - name: Upload compare report
        if: inputs.provider == 'compare'
        uses: actions/upload-artifact@v4
        with:
          name: compare-report
          path: compare-output/*.md
          if-no-files-found: ignore

      - name: Collect dry-run articles
        if: inputs.dry_run && steps.generate.outputs.count != '0'
        # 既存の記事は除き、今回生成されたファイルだけを集める
        run: |
          mkdir -p dry-run-output
          git ls-files --others --exclude-standard src/content/posts | xargs -r -I{} cp {} dry-run-output/

      - name: Upload dry-run articles
        if: inputs.dry_run && steps.generate.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-posts
          path: dry-run-output/

      - name: Commit and push
        if: ${{ !inputs.dry_run && inputs.provider != 'compare' && steps.generate.outputs.count != '0' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/posts data/seen.json
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "Add AI news for $(TZ=Asia/Tokyo date +%Y-%m-%d) (${{ steps.generate.outputs.count }} posts)"
          git push

  build:
    needs: generate
    # push 時は generate がスキップされるので always() で評価し、条件を明示する
    if: >-
      always() && (
        github.event_name == 'push' ||
        (needs.generate.result == 'success' && !inputs.dry_run && inputs.provider != 'compare' &&
          (needs.generate.outputs.count != '0' || inputs.force_deploy))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # generate ジョブで push したコミットを含む最新のブランチを取得する
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/configure-pages@v5

      - run: npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
